<svg xmlns="http://www.w3.org/2000/svg" width="900" height="485" viewBox="0 0 900 485" role="img" aria-labelledby="title desc">
<title id="title">Reported regression t-statistics by pre-expiration lookback</title>
<desc id="desc">Line chart comparing reported OPEX and VIX-expiration regression t-statistics for 3, 5, 7, 10, 14, and 21 day lookbacks. OPEX values are -1.80, -2.40, -2.11, -2.83, -3.96 and -3.76; VIX values are -0.33, 0.41, 0.36, -1.05, zero and -0.81. The horizontal dashed line is the illustrative negative conventional threshold of -1.96. Figures transcribed from the source report; not independently reproduced.</desc>
